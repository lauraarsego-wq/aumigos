    <!-- WIDGET DO MASCOTE E CHATBOT REVISADO -->
    <div class="chat-container">
        <!-- Balão de Fala do Mascote -->
        <div class="balao-mascote" id="balaoMascote">Au-au! Precisa de uma patazinha? 🐾</div>
        
        <!-- Botão do Mascote (Imagem corrigida) -->
        <div class="mascote-btn" id="mascoteBtn" onclick="toggleChat()">

        <div class="chat-janela" id="chatJanela">

            </div>
            <div class="chat-opcoes">
                <button onclick="responder('servicos')">🐾 Ver Serviços</button>
                <button onclick="responder('horario')">⏰ Horário de Funcionamento</button>
                <button onclick="responder('humano')">📞 Falar com Humano</button>
            </div>
        </div>
    </div>
