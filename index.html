<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal EcoPatas | Cuidados e Interação</title>
    <style>
        /* Reset basico para garantir o funcionamento visual */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }
        .conteudo-principal {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media(min-width: 768px) {
            .conteudo-principal {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Estilos do Formulario */
        .form-interacao {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .form-grupo {
            margin-bottom: 15px;
        }
        .form-grupo label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        .form-grupo input[type="text"],
        .form-grupo input[type="file"],
        .form-grupo textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-grupo textarea {
            resize: vertical;
            height: 80px;
        }
        .btn-enviar {
            background-color: #2ecc71;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }
        .btn-enviar:hover {
            background-color: #27ae60;
        }

        /* Estilos da Secao do Quiz Interativo */
        .quiz-container {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .progresso-container {
            background-color: #e9ecef;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progresso-barra {
            background-color: #3498db;
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
        #quiz-box h3 {
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .quiz-opcoes {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .opcao-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            border-radius: 6px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        .opcao-btn:hover {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
        }
        .opcao-btn.correta {
            background-color: #d1e7dd !important;
            border-color: #a3cfbb !important;
            color: #0f5132 !important;
        }
        .opcao-btn.errada {
            background-color: #f8d7da !important;
            border-color: #f5c2c7 !important;
            color: #842029 !important;
        }
        .quiz-resultado {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
        }
        .quiz-resultado.sucesso {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .quiz-resultado.errada {
            background-color: #f8d7da;
            color: #842029;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>🐾 EcoPatas Notícias</h1>
        <p>O portal da causa animal no Brasil</p>
    </header>

    <main class="container">
        <div class="conteudo-principal">
            
            <!-- COLUNA 1: QUIZ INTERATIVO -->
            <section class="quiz-container">
                <h2>🧩 Desafio EcoPatas: Curiosidades Animais</h2>
                <p style="margin-bottom: 15px; color: #666;">Descubra fatos incríveis sobre o seu melhor amigo!</p>
                
                <div class="progresso-container">
                    <div id="quiz-progresso" class="progresso-barra"></div>
                </div>

                <div id="quiz-box">
                    <h3 id="pergunta-texto">Carregando pergunta...</h3>
                    <div class="quiz-opcoes" id="opcoes-container"></div>
                    <div id="quiz-resultado" class="quiz-resultado hidden"></div>
                    <button id="btn-proximo" class="btn-enviar" style="margin-top: 15px; display: none;">Próxima Pergunta 🐾</button>
                </div>
            </section>

            <!-- COLUNA 2: FORMULÁRIO DE ENVIO -->
            <section class="form-interacao">
                <h2>📸 Espaço do Leitor & Aumigos</h2>
                <p style="margin-bottom: 15px; color: #666;">Envie uma foto do seu melhor amigo!</p>
                
                <!-- IMPORTANTE: Insira seu ID do Formspree no lugar de SEU_ID_AQUI -->
                <form action="https://formspree.io" method="POST" enctype="multipart/form-data">
                    <div class="form-grupo">
                        <label for="nome">Seu Nome:</label>
                        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
                    </div>

                    <div class="form-grupo">
                        <label for="pet">Nome do seu Aumigo:</label>
                        <input type="text" id="pet" name="nome_do_pet" required placeholder="Ex: Bob, Mel...">
                    </div>

                    <div class="form-grupo">
                        <label for="mensagem">Mensagem ou História:</label>
                        <textarea id="mensagem" name="mensagem" required placeholder="Conte um pouco sobre ele..."></textarea>
                    </div>

                    <div class="form-grupo">
                        <label for="foto">Foto do seu Aumigo:</label>
                        <input type="file" id="foto" name="foto_do_pet" accept="image/*" required>
                    </div>

                    <button type="submit" class="btn-enviar">Enviar para o Portal 🐾</button>
                </form>
            </section>

        </div>
    </main>

    <!-- Código do Quiz -->
    <script>
        const perguntas = [
            {
                pergunta: "O que significa quando um gato pisca os dois olhos lentamente para você?",
                opcoes: ["Ele está com sono", "É um sinal de afeto e confiança", "Ele está com irritação ocular", "Ele está te desafiando"],
                correta: 1,
                explicacao: "Na linguagem felina, piscar lentamente demonstra que o gato se sente seguro e gosta de você!"
            },
            {
                pergunta: "Qual sentido é o mais desenvolvido e poderoso nos cães?",
                opcoes: ["A visão noturna", "O paladar", "O olfato", "A audição"],
                correta: 2,
                explicacao: "O olfato dos cães é extremamente apurado, permitindo-lhes 'enxergar' o mundo pelos cheiros."
            },
            {
                pergunta: "Como os cães controlam e regulam a temperatura do corpo no calor?",
                opcoes: ["Suando pela pele", "Arfando (com a boca aberta e a língua para fora)", "Balançando a cauda", "Bebendo água quente"],
                correta: 1,
                explicacao: "Eles realizam a troca de calor principalmente através da respiração rápida pela boca."
            }
        ];

        let perguntaAtual = 0;
        let respondido = false;

        const textoPergunta = document.getElementById("pergunta-texto");
        const containerOpcoes = document.getElementById("opcoes-container");
        const divResultado = document.getElementById("quiz-resultado");
        const btnProximo = document.getElementById("btn-proximo");
        const barraProgresso = document.getElementById("quiz-progresso");

        function atualizarProgresso() {
            const porcentagem = (perguntaAtual / perguntas.length) * 100;
            barraProgresso.style.width = porcentagem + "%";
        }

        function carregarPergunta() {
            respondido = false;
            divResultado.classList.add("hidden");
            btnProximo.style.display = "none";
            containerOpcoes.innerHTML = "";
            
            atualizarProgresso();
            
            if (perguntaAtual >= perguntas.length) {
                textoPergunta.innerHTML = "🎉 Parabéns! Você concluiu o Quiz!";
                containerOpcoes.innerHTML = "<p style='text-align:center; font-weight:500; color:#27ae60;'>Você conhece bem as necessidades dos animais! Continue cuidando muito bem deles. 🐾</p>";
                return;
            }
            
            let dadosQuiz = perguntas[perguntaAtual];
            textoPergunta.innerText = dadosQuiz.pergunta;
            
            dadosQuiz.opcoes.forEach((opcao, index) => {
                const botao = document.createElement("button");
                botao.innerText = opacity = opcao;
